name: Deploy to Play (internal)

# Builds a signed app bundle and ships it to the Play Console "internal"
# testing track. Manual trigger only for now (Actions tab -> Run workflow) —
# auto-deploy on push to main is temporarily disabled until the Play secrets and
# the first manual Play Console upload are in place. Re-enable by restoring the
# `push: branches: [main]` trigger below.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of mass-driver-keystore.jks
#                               (`base64 -i mass-driver-keystore.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD   keystore/key password (same value for PKCS12)
#   ANDROID_KEY_ALIAS           key alias (e.g. mass-drive)
#   PLAY_SERVICE_ACCOUNT_JSON   full JSON of a Play Console service account
#                               with "Release to testing tracks" permission
#   MAPS_API_KEY                Android Google Maps API key. Must be restricted
#                               to package com.massapp.massdrive with the
#                               upload keystore's SHA-1, or the map renders grey.
#   GOOGLE_DIRECTIONS_API_KEY   Google Directions API key. Written into .env,
#                               which DirectionsService reads at runtime to draw
#                               route polylines. .env is also a required pubspec
#                               asset, so the build fails outright if it is absent.
#
# Note: the very first release for a package must be uploaded through the
# Play Console UI once. After that this workflow can publish updates.
# This ships com.massapp.massdrive (the "Mass Driver" app), which already
# exists in Play Console — so once one bundle has been uploaded by hand to its
# internal track, this workflow can publish updates automatically.

on:
  # Manual only for now. To re-enable auto-deploy, uncomment the push trigger:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-play
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.6"
  JAVA_VERSION: "17"
  # Must match the applicationId the build below actually produces. The build
  # uses config/preprod.json (APP_PACKAGE_NAME_SUFFIX is empty), so this ships
  # com.massapp.massdrive — the single Play app used for both testing and prod
  # (separated by track, not by package).
  PACKAGE_NAME: "com.massapp.massdrive"

jobs:
  deploy:
    name: Build signed bundle & upload
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/android/app/upload-keystore.jks"

      - name: Create key.properties
        run: |
          cat > "${{ github.workspace }}/android/key.properties" <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/android/app/upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # build.gradle.kts reads MAPS_API_KEY from local.properties (exactly like a
      # dev machine) and injects it into the manifest's com.google.android.geo.API_KEY.
      # Without it the release map renders grey. `flutter pub get` above already
      # created local.properties; appending the key lets the build below pick it up
      # (the flutter tool preserves unknown keys when it rewrites the file).
      - name: Inject Maps API key
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> android/local.properties

      # .env is gitignored but declared as a pubspec asset, so the build fails to
      # bundle assets if it is missing. main.dart loads it via dotenv and
      # DirectionsService reads GOOGLE_DIRECTIONS_API_KEY from it to draw route
      # polylines — an empty key would ship a build with no routes. Write the real
      # key here (overwrite, not append, so reruns stay clean).
      - name: Create .env
        run: echo "GOOGLE_DIRECTIONS_API_KEY=${{ secrets.GOOGLE_DIRECTIONS_API_KEY }}" > .env

      # versionCode = run number + offset. The offset clears the versionCode of
      # the first bundle uploaded manually (1), so this never collides. The run
      # number keeps every subsequent upload unique and increasing. Arithmetic
      # is done in the shell because Actions expressions have no "+" operator.
      # APP_NAME is overridden last, on purpose: the identity file here is
      # mass_dev.json (dev Firebase), whose APP_NAME is "Massdrive DEV". That
      # label is right for a local dev build but wrong on the Play listing,
      # which is the real com.massapp.massdrive app. A later --dart-define wins
      # over the ones loaded from files.
      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=config/preprod.json \
            --dart-define-from-file=config/mass_dev.json \
            --dart-define=APP_NAME=massdrive \
            --build-number=$((GITHUB_RUN_NUMBER + 10))

      - name: Upload to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up secrets
        if: always()
        run: rm -f "${{ github.workspace }}/android/key.properties" "${{ github.workspace }}/android/app/upload-keystore.jks" "${{ github.workspace }}/android/local.properties" "${{ github.workspace }}/.env"
