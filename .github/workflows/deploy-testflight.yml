name: Deploy to TestFlight

# Builds a signed .ipa on a macOS runner and uploads it to App Store Connect.
# Manual trigger only. This is the CI counterpart of `make deploy-dev`, which
# does the same round trip from a developer's Mac.
#
# Two apps, picked by the `environment` input:
#   dev  -> com.massapp.massdrive.dev   (App Store Connect app "MassDriverDev")
#   prod -> com.massapp.massdrive       (the real Massdrive app)
#
# The suffix comes from BUNDLE_ID_SUFFIX in the Xcode project. Release builds
# leave it empty (prod), so the dev build overrides it through
# ios/Flutter/Release.local.xcconfig — the gitignored, #include?'d-last hook the
# Makefile already uses. This workflow writes the same file, and uses it to
# force manual code signing too: the Runner target is set to Automatic signing,
# which needs an Xcode-signed-in Apple account and cannot work on a runner.
#
# Required repository secrets:
#   IOS_DIST_CERT_P12_BASE64        Apple Distribution certificate, .p12,
#                                   base64 (`base64 -i cert.p12 | pbcopy`)
#   IOS_DIST_CERT_PASSWORD          password used when exporting that .p12
#   IOS_PROFILE_DEV_BASE64          App Store provisioning profile for
#                                   com.massapp.massdrive.dev, base64
#   IOS_PROFILE_PROD_BASE64         ... and for com.massapp.massdrive
#   ASC_KEY_ID                      App Store Connect API key id
#   ASC_ISSUER_ID                   ... and its issuer id
#   ASC_PRIVATE_KEY                 contents of AuthKey_<ASC_KEY_ID>.p8
#   GOOGLE_DIRECTIONS_API_KEY       written into .env (a required pubspec asset)
#
# The profile's name and bundle id are read back out of the decoded profile
# rather than kept as extra secrets, so renaming a profile in the developer
# portal cannot silently desync from what this file thinks it is called.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which App Store Connect app to ship to.
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      build_number:
        description: >-
          Build number for this upload. App Store Connect rejects a number it
          has already seen, and pubspec's number trails what has been uploaded,
          so it is passed explicitly rather than derived.
        required: true
        type: string

concurrency:
  group: deploy-testflight-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.6"
  TEAM_ID: "Q7742Z74Q3"

jobs:
  deploy:
    name: Build .ipa & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Guard — build number supplied
        run: |
          case "${{ inputs.build_number }}" in
            ''|*[!0-9]*)
              echo "::error::build_number must be a positive integer."
              exit 1 ;;
          esac

      # config/prod.json and mass_prod.json still ship placeholders. Shipping
      # them would put an app pointed at REPLACE_ME.prod.example, with a dead
      # payment key, in front of TestFlight testers.
      - name: Guard — prod config has no placeholders
        if: inputs.environment == 'prod'
        run: |
          fail=0
          for f in config/prod.json config/mass_prod.json; do
            if grep -q "REPLACE_ME" "$f"; then
              echo "::error file=$f::$f still contains REPLACE_ME."
              grep -n "REPLACE_ME" "$f"
              fail=1
            fi
          done
          exit $fail

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env is gitignored but declared as a pubspec asset, so the asset bundle
      # fails without it. DirectionsService reads the key from it at runtime.
      - name: Create .env
        run: echo "GOOGLE_DIRECTIONS_API_KEY=${{ secrets.GOOGLE_DIRECTIONS_API_KEY }}" > .env

      # A dispatch can target a commit that never went through a PR.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      # Certificate goes into a throwaway keychain so nothing is left behind on
      # the runner image and the default keychain is never touched.
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"

      # Install the profile where Xcode looks for it, then read its name and
      # bundle id back out so the export options below cannot drift from it.
      - name: Install provisioning profile
        id: profile
        env:
          PROFILE_B64: ${{ inputs.environment == 'prod' && secrets.IOS_PROFILE_PROD_BASE64 || secrets.IOS_PROFILE_DEV_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"

          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"

          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST")
          # application-identifier is "<TEAMID>.<bundle id>".
          BUNDLE_ID="${APP_ID#*.}"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Profile '$NAME' for $BUNDLE_ID"

      # Release.local.xcconfig is #include?'d last by Release.xcconfig, so this
      # overrides both the bundle id suffix and the signing style. It is
      # gitignored and removed in cleanup, exactly like `make deploy-dev` does.
      - name: Write build overrides
        run: |
          set -euo pipefail
          {
            if [ "${{ inputs.environment }}" = "dev" ]; then
              echo "BUNDLE_ID_SUFFIX = .dev"
              echo "APP_DISPLAY_NAME = Massdrive DEV"
            fi
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${{ steps.profile.outputs.name }}"
            echo "DEVELOPMENT_TEAM = ${{ env.TEAM_ID }}"
          } > ios/Flutter/Release.local.xcconfig
          cat ios/Flutter/Release.local.xcconfig

      # The committed ios/ExportOptions.plist uses automatic signing, which is
      # right for a developer's Mac and unusable here — generate a manual one.
      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ env.TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ steps.profile.outputs.bundle_id }}</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build signed .ipa
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = "prod" ]; then
            CONFIGS="--dart-define-from-file=config/prod.json --dart-define-from-file=config/mass_prod.json"
          else
            CONFIGS="--dart-define-from-file=config/dev.json --dart-define-from-file=config/mass_dev.json"
          fi
          flutter build ipa --release $CONFIGS \
            --build-number=${{ inputs.build_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ls -l build/ios/ipa/

      # altool reads the key from a fixed location rather than a flag.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -t ios -f "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Keep the .ipa even when the upload fails, so it can be sent with
      # Transporter instead of rebuilding for an hour.
      - name: Upload .ipa as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ inputs.environment }}-${{ inputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          rm -f ios/Flutter/Release.local.xcconfig .env
          rm -rf ~/.appstoreconnect/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
